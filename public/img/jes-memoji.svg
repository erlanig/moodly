<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background / Soft iOS Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffeef3"/>
      <stop offset="100%" stop-color="#ffd5e2"/>
    </radialGradient>
    
    <!-- Face 3D Skin Gradient -->
    <radialGradient id="skinGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffdfd4"/>
      <stop offset="65%" stop-color="#f5c2b2"/>
      <stop offset="100%" stop-color="#e5a695"/>
    </radialGradient>
    
    <!-- Cheek Blush -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b92" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7b92" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair 3D Gradient -->
    <linearGradient id="hairDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3d231b"/>
      <stop offset="40%" stop-color="#2c1813"/>
      <stop offset="100%" stop-color="#190d0a"/>
    </linearGradient>

    <linearGradient id="hairShine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5a382c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#734939" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a382c" stop-opacity="0"/>
    </linearGradient>

    <!-- Eye 3D Gradient -->
    <radialGradient id="irisGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6a432d"/>
      <stop offset="70%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1a0c07"/>
    </radialGradient>

    <!-- Lip 3D Gradient -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4717f"/>
      <stop offset="100%" stop-color="#d94b5c"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a8435d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Back Hair -->
  <path d="M26 62 C24 88 38 102 60 102 C82 102 96 88 94 62 C94 38 88 22 60 22 C32 22 26 38 26 62 Z" fill="url(#hairDark)"/>

  <!-- Neck & Shoulders -->
  <path d="M48 82 L72 82 L76 106 C76 106 68 112 60 112 C52 112 44 106 44 106 Z" fill="#f0bba9"/>
  <!-- Collar / Shirt -->
  <path d="M34 108 C40 98 48 94 60 94 C72 94 80 98 86 108 C80 114 70 116 60 116 C50 116 40 114 34 108 Z" fill="#ff4b72"/>

  <!-- Face Head -->
  <ellipse cx="60" cy="62" rx="27" ry="29" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="32" cy="64" r="6" fill="#f2bfaa"/>
  <circle cx="88" cy="64" r="6" fill="#ebb29d"/>

  <!-- Front Hair Fringe / Volume -->
  <path d="M33 48 C36 28 50 20 60 20 C72 20 86 28 88 48 C83 40 74 36 60 36 C46 36 37 42 33 48 Z" fill="url(#hairDark)"/>
  <!-- Hair Highlights -->
  <path d="M36 44 C42 32 50 26 60 26 C70 26 80 32 84 44 C77 36 68 32 60 32 C52 32 43 36 36 44 Z" fill="url(#hairShine)"/>
  <path d="M32 48 C32 64 36 74 38 78 C36 70 34 58 35 48 Z" fill="url(#hairDark)"/>
  <path d="M88 48 C88 64 84 74 82 78 C84 70 86 58 85 48 Z" fill="url(#hairDark)"/>

  <!-- Eyebrows -->
  <path d="M42 50 Q48 46 54 50" stroke="#3d231b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M66 50 Q72 46 78 50" stroke="#3d231b" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <ellipse cx="42" cy="68" rx="7" ry="4" fill="url(#blush)"/>
  <ellipse cx="78" cy="68" rx="7" ry="4" fill="url(#blush)"/>

  <!-- Left Eye -->
  <ellipse cx="48" cy="57" rx="5" ry="5.5" fill="#ffffff"/>
  <circle cx="49" cy="57" r="3.6" fill="url(#irisGrad)"/>
  <circle cx="50" cy="55.5" r="1.3" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="72" cy="57" rx="5" ry="5.5" fill="#ffffff"/>
  <circle cx="71" cy="57" r="3.6" fill="url(#irisGrad)"/>
  <circle cx="72" cy="55.5" r="1.3" fill="#ffffff"/>

  <!-- Soft Eyelashes -->
  <path d="M43 55 Q48 52 54 55" stroke="#2c1813" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M66 55 Q72 52 77 55" stroke="#2c1813" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M58 64 Q60 66 62 64" stroke="#df9f8b" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Friendly Natural Smile -->
  <path d="M51 73 Q60 80 69 73" stroke="url(#lipGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Soft Lower Lip shadow -->
  <path d="M56 77 Q60 79 64 77" stroke="#e08f9c" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
